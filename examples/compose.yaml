# START HERE. The whole stack, however many pools: four containers.
# Follow docs/QUICKSTART.md; `runner-scaling init` writes this file and its neighbours for you. Run it from a directory that holds:
#
#   compose.yaml     (this file)
#   guard.yaml       the pools (copied from guard-pools.yaml): edit github_url (and later tenant_url)
#   .env             GITHUB_APP_CLIENT_ID, GITHUB_APP_INSTALLATION_ID and DOCKER_GID (see env.example)
#   secrets/github_app.pem   the App's private key, owned by uid 65532, mode 0400 (see QUICKSTART, step 3)
#
# Four containers, each holding only what it needs:
#   scaler        GitHub (outbound) and the App key; no Docker           -> asks the guard for slots, one scale set per pool
#   guard         no network, no credentials, no socket, not root         -> builds containers only from guard.yaml
#   docker-policy the Docker socket, no network, not root                 -> checks every call field by field
#   firewall      the host's network namespace, one capability           -> fences runner networks off your LAN
# See docs/SECURITY-POSTURE.md.
name: runner-scaling

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # journald keeps logs after the container is removed (journalctl CONTAINER_NAME=<container>). No systemd on the
  # host? Delete this block: Docker's default json-file driver works, but its logs go when the container does.
  logging:
    driver: journald
    options: {tag: "{{.Name}}"}

services:
  # Fences the runner networks (jobs reach the internet, not your LAN or the host), then creates /gate/firewall-ok.
  # The guard starts no slot until that file exists.
  firewall:
    <<: *hardened
    image: ghcr.io/macleodtech/runner-scaling:0.12   # same image; `firewall` is one of its roles (pin a digest)
    network_mode: host
    user: "0:0"                 # root, but with every capability dropped except the one netlink needs
    cap_add: [NET_ADMIN]
    command: [firewall]
    environment:
      FENCE_SRC: 172.30.0.0/16  # must contain every pool's `subnet` range
      # FENCE_SRC6: fd00:a::/48 # only if you gave the runner networks IPv6 (the guard does not by default)
      # FENCE_METRICS: 127.0.0.1:9102   # Prometheus: runner_fence_ok, runner_fence_reapplied_total, ...
    volumes:
      - gate:/gate
    mem_limit: 32m
    pids_limit: 32

  # The only container with the Docker socket. It reads guard.yaml, rebuilds the one container each request is
  # allowed to be, and refuses every Docker call that differs by a single field (a privileged flag, an extra mount,
  # another image). Even a fully compromised guard can then do no more than guard.yaml says. No network.
  docker-policy:
    <<: *hardened
    image: ghcr.io/macleodtech/runner-scaling:0.12
    user: "65533:65532"        # not root: it only needs the socket's group. 65532 is the group the guard shares with it.
    group_add: ["${DOCKER_GID:?set it in .env: stat -c %g /var/run/docker.sock}"]
    network_mode: none
    mem_limit: 64m
    pids_limit: 64
    command: [docker-policy, --config, /etc/runner-scaling/guard.yaml]
    healthcheck:
      test: [CMD, /usr/local/bin/runner-scaling, health, --docker-policy-socket, /run/docker-policy/docker.sock]
      interval: 30s
    volumes:
      - ./guard.yaml:/etc/runner-scaling/guard.yaml:ro   # the SAME file the guard reads
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-policy-api:/run/docker-policy

  # Builds containers only from guard.yaml, for every pool. No network, no credentials, no Docker socket, not root: it
  # reaches Docker only through docker-policy.
  guard:
    <<: *hardened
    image: ghcr.io/macleodtech/runner-scaling:0.12   # pin a digest (`docker buildx imagetools inspect <image>`) once it works
    user: "65532:65532"
    network_mode: none
    mem_limit: 64m
    pids_limit: 64
    environment:
      DOCKER_SOCKET: /run/docker-policy/docker.sock
    command: [guard, --config, /etc/runner-scaling/guard.yaml]
    healthcheck:
      test: [CMD, /usr/local/bin/runner-scaling, health]
      interval: 30s
    volumes:
      - ./guard.yaml:/etc/runner-scaling/guard.yaml:ro
      - docker-policy-api:/run/docker-policy:ro
      - guard-api:/run/runner-scaling
      - gate:/gate:ro
    depends_on:
      docker-policy: {condition: service_healthy}

  # Talks to GitHub (outbound only) and asks the guard for slots. Holds the GitHub App key; has no Docker access.
  # It finds the pools in guard.yaml through the guard and keeps one scale set per pool.
  scaler:
    <<: *hardened
    image: ghcr.io/macleodtech/runner-scaling:0.12
    mem_limit: 128m
    pids_limit: 64
    command: [scaler]
    environment:
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?set it in .env}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:?set it in .env}
      GITHUB_APP_PRIVATE_KEY_FILE: /run/secrets/github_app_key   # a file, so `docker inspect` never shows the key
    secrets: [github_app_key]
    volumes:
      - guard-api:/run/runner-scaling
    depends_on:
      guard: {condition: service_healthy}

secrets:
  github_app_key:
    file: ./secrets/github_app.pem

volumes:
  guard-api:
  docker-policy-api:
  gate:     # a tmpfs: empty after every reboot, so no runner starts before the fence is back
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=1m,mode=0755"}
