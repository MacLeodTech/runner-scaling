# NOT your first file: start with compose.lite.yaml and docs/QUICKSTART.md. This one adds a second pool that has Docker.
# The `main` pool below uses guard.yaml, whose dind is PRIVILEGED (any job is root on the host). To use Sysbox instead,
# point it at guard-sysbox.yaml. Secrets here are read from .env; compose.lite.yaml shows the safer secret-as-file way.
#
# Example deployment: two pools on one host, each a guard + scaler pair, plus the firewall sidecar.
#
#   pool  runs-on labels              runner gets            guard config     slots
#   main  [self-hosted, ci]           its own Docker daemon  guard.yaml       2
#   lite  [self-hosted, ci-lite]      no Docker              guard-lite.yaml  4
#
# Put GITHUB_APP_* (or GITHUB_TOKEN) in .env next to this file. Both pools share one memory budget
# (memory_budget in both guard configs). Start with `docker compose up -d`.
name: runner-scaling

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  # Logs survive `compose down` and recreation only if they go somewhere outside the container. journald keeps them in
  # the host journal (journalctl CONTAINER_NAME=<container>); the default json-file driver loses them with the container.
  logging:
    driver: journald
    options: {tag: "{{.Name}}"}

# One docker-policy per guard holds the Docker socket and checks every call against that guard's config (see
# compose.lite.yaml for the explanation). The guards themselves have no socket and are not root.
x-policy: &policy
  <<: *hardened
  image: ghcr.io/macleodtech/runner-scaling:0.11   # pin a digest
  user: "65533:65532"
  group_add: ["${DOCKER_GID:?set it in .env: stat -c %g /var/run/docker.sock}"]
  network_mode: none
  mem_limit: 64m
  pids_limit: 64
  healthcheck:
    test: [CMD, /usr/local/bin/runner-scaling, health, --docker-policy-socket, /run/docker-policy/docker.sock]
    interval: 30s

x-guard: &guard
  <<: *hardened
  image: ghcr.io/macleodtech/runner-scaling:0.11   # pin a digest
  user: "65532:65532"
  network_mode: none         # needs no network: it talks to Docker (via docker-policy) and the scaler over unix sockets
  environment:
    DOCKER_SOCKET: /run/docker-policy/docker.sock
  mem_limit: 64m
  pids_limit: 64
  healthcheck:
    test: [CMD, /usr/local/bin/runner-scaling, health]
    interval: 30s

x-scaler: &scaler
  <<: *hardened
  image: ghcr.io/macleodtech/runner-scaling:0.11   # pin a digest
  mem_limit: 128m
  pids_limit: 64
  env_file: [.env]

services:
  # Fences the runner networks and creates /gate/firewall-ok, which both guards wait for (require_file).
  firewall:
    <<: *hardened
    image: ghcr.io/macleodtech/runner-scaling:0.11   # same image; `firewall` is one of its roles (pin a digest)
    network_mode: host
    user: "0:0"                 # root, but with every capability dropped except the one netlink needs
    cap_add: [NET_ADMIN]
    command: [firewall]
    environment:
      FENCE_SRC: 172.30.0.0/16  # must contain every guard's `subnet` range
      # FENCE_SRC6: fd00:a::/48 # only if you gave the runner networks IPv6 (the guard does not by default)
      # FENCE_METRICS: 127.0.0.1:9102   # Prometheus: runner_fence_ok, runner_fence_reapplied_total, ...
    volumes:
      - gate:/gate
    mem_limit: 32m
    pids_limit: 32

  docker-policy:
    <<: *policy
    command: [docker-policy, --config, /etc/runner-scaling/guard.yaml]
    volumes:
      - ./guard.yaml:/etc/runner-scaling/guard.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-policy-api:/run/docker-policy

  guard:
    <<: *guard
    command: [guard, --config, /etc/runner-scaling/guard.yaml]
    volumes:
      - ./guard.yaml:/etc/runner-scaling/guard.yaml:ro
      - docker-policy-api:/run/docker-policy:ro
      - guard-api:/run/runner-scaling
      - gate:/gate:ro
    depends_on:
      docker-policy: {condition: service_healthy}

  scaler:
    <<: *scaler
    command: [scaler, --name, ci, --labels, "self-hosted,linux,x64,ci"]
    volumes:
      - guard-api:/run/runner-scaling
    depends_on:
      guard: {condition: service_healthy}

  docker-policy-lite:
    <<: *policy
    command: [docker-policy, --config, /etc/runner-scaling/guard.yaml]
    volumes:
      - ./guard-lite.yaml:/etc/runner-scaling/guard.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - docker-policy-lite-api:/run/docker-policy

  guard-lite:
    <<: *guard
    command: [guard, --config, /etc/runner-scaling/guard.yaml]
    volumes:
      - ./guard-lite.yaml:/etc/runner-scaling/guard.yaml:ro
      - docker-policy-lite-api:/run/docker-policy:ro
      - guard-lite-api:/run/runner-scaling
      - gate:/gate:ro
    depends_on:
      docker-policy-lite: {condition: service_healthy}

  scaler-lite:
    <<: *scaler
    command: [scaler, --name, ci-lite, --labels, "self-hosted,linux,x64,ci-lite"]
    volumes:
      - guard-lite-api:/run/runner-scaling
    depends_on:
      guard-lite: {condition: service_healthy}

volumes:
  guard-api:
  guard-lite-api:
  docker-policy-api:
  docker-policy-lite-api:
  gate:     # a tmpfs: empty after every reboot, so no runner starts before the fence is back
    driver_opts: {type: tmpfs, device: tmpfs, o: "size=1m,mode=0755"}
